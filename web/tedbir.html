<title>Tedbir</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Onest:wght@400;500;600;700&family=Young+Serif&display=swap">
<style>
/* Layout: tek sütunluk telefon defteri (en çok 600px). Üstte marka ve dönem seçimi, yapışkan tarih çubuğu; altta sabit dört sekme. Tedbirler cetvelli satırlar halinde; muhasebe bir kaşe mührüyle kapanır. */
:root{
  --bg:#F3F2F8;--surface:#FFFFFF;--sunken:#ECEAF4;--ink:#1C1930;--ink-2:#57526E;--muted:#736E89;--line:#E2DFEC;--axis:#C5C0D6;
  --accent:#4B3BB8;--accent-hi:#6E60D8;--accent-ink:#FFFFFF;--accent-soft:#EAE7FA;--track:#A79DE6;
  --good:#13703A;--warn:#8F5600;--bad:#B42318;
  --scrim:rgba(20,16,40,.42);--shadow:0 1px 2px rgba(28,25,48,.06),0 6px 20px rgba(28,25,48,.07);--shadow-sm:0 1px 2px rgba(28,25,48,.14);--shadow-fab:0 8px 22px rgba(58,44,160,.30);
  --f-display:"Young Serif","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --radius:14px;--bar-h:64px;
  /* Kenar boşlukları: Android uygulamasında Capacitor --safe-area-inset-* verir, tarayıcıda env() kullanılır */
  --sat:var(--safe-area-inset-top,env(safe-area-inset-top,0px));--sab:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px));--sal:var(--safe-area-inset-left,env(safe-area-inset-left,0px));--sar:var(--safe-area-inset-right,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12111A;--surface:#1B1A26;--sunken:#252333;--ink:#EDEBF6;--ink-2:#B7B2CC;--muted:#8F8AA6;--line:#2D2B3C;--axis:#454159;
  --accent:#A99CFF;--accent-hi:#C4BAFF;--accent-ink:#17142E;--accent-soft:#2A2648;--track:#5A51A8;
  --good:#5CCB86;--warn:#F2B54F;--bad:#FF8577;
  --scrim:rgba(0,0,0,.55);--shadow:0 1px 2px rgba(0,0,0,.35),0 6px 20px rgba(0,0,0,.30);--shadow-sm:0 1px 2px rgba(0,0,0,.5);--shadow-fab:0 8px 22px rgba(0,0,0,.45);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#12111A;--surface:#1B1A26;--sunken:#252333;--ink:#EDEBF6;--ink-2:#B7B2CC;--muted:#8F8AA6;--line:#2D2B3C;--axis:#454159;
  --accent:#A99CFF;--accent-hi:#C4BAFF;--accent-ink:#17142E;--accent-soft:#2A2648;--track:#5A51A8;
  --good:#5CCB86;--warn:#F2B54F;--bad:#FF8577;
  --scrim:rgba(0,0,0,.55);--shadow:0 1px 2px rgba(0,0,0,.35),0 6px 20px rgba(0,0,0,.30);--shadow-sm:0 1px 2px rgba(0,0,0,.5);--shadow-fab:0 8px 22px rgba(0,0,0,.45);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:var(--sat);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0}
.mono{font-family:var(--f-mono)}
#app{max-width:600px;margin:0 auto;padding-left:max(16px,var(--sal));padding-right:max(16px,var(--sar));padding-block:6px calc(var(--bar-h) + 104px)}

/* Üst kısım */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px 6px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:38px;height:38px;color:var(--accent);flex:none}
.brand-name{font-family:var(--f-display);font-weight:400;font-size:27px;line-height:1;letter-spacing:-.01em}
.brand-tag{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-2);flex:none;padding:0}
.icon-btn svg{width:20px;height:20px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;padding:4px;background:var(--sunken);border-radius:12px}
.seg button{border:0;background:transparent;padding:6px 4px;border-radius:9px;font-weight:600;font-size:14px;color:var(--ink-2);min-height:38px}
.seg.sm button{font-size:13px;min-height:36px}
.seg button[aria-selected="true"],.seg button[aria-checked="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.periods{margin-top:6px}
.datebar{position:sticky;top:var(--sat);z-index:15;background:var(--bg);display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:8px;padding-block:10px 8px}
.nav-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink);padding:0}
.nav-btn svg{width:18px;height:18px}
.date-c{text-align:center;min-width:0}
.date-main{font-family:var(--f-display);font-size:21px;line-height:1.2;text-wrap:balance}
.date-sub{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px 8px;margin-top:3px;font-size:13px;color:var(--ink-2);min-height:18px}
.today-btn{border:0;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:12px;padding:3px 10px;border-radius:999px}
.mini-seal{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;color:var(--accent);border:1.5px solid currentColor;border-radius:999px;padding:0 8px;line-height:1.5}
.note{margin:2px 0 6px;padding:8px 12px;border-radius:10px;background:var(--sunken);color:var(--ink-2);font-size:13px}

/* Görünüm ve bölümler */
#view{display:grid;gap:16px;padding-top:4px}
.sec{display:grid;gap:8px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 4px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sec-h span{letter-spacing:0;font-weight:500;font-family:var(--f-mono)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.pad{padding:14px}
.list>*+*{border-top:1px solid var(--line)}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-radius:12px;background:var(--accent-soft);font-size:13.5px}
.link{border:0;background:none;padding:0;color:var(--accent);font-weight:600;font-size:inherit;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.hint{margin:0;font-size:13px;color:var(--muted);line-height:1.5}
.ok{display:flex;align-items:center;gap:6px;margin:0;color:var(--good);font-weight:600;font-size:14px}
.ok svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Düğmeler ve alanlar */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:15px}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{min-height:38px;padding:0 14px;font-size:14px;border-radius:10px}
.btn.wide{width:100%}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-left:6px}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=time],input[type=number],input[type=date],textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;min-width:0;min-height:44px}
input[type=time],input[type=number],input[type=date]{font-family:var(--f-mono)}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
textarea{min-height:104px;resize:vertical;line-height:1.5;display:block}
input::placeholder,textarea::placeholder{color:var(--muted)}
input[readonly],textarea[readonly]{background:var(--sunken);color:var(--ink-2)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0;padding:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--accent) 0 var(--v,0%),var(--sunken) var(--v,0%) 100%)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-9px;border-radius:50%;background:var(--surface);border:2px solid var(--accent);box-shadow:var(--shadow-sm)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--sunken)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
input[type=range].unset::-webkit-slider-thumb{border-color:var(--axis)}
input[type=range].unset::-moz-range-thumb{border-color:var(--axis)}
input[type=range].unset::-moz-range-progress{background:transparent}

/* Tedbir satırları */
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;padding:13px 14px;border:0;background:none;color:inherit;text-align:left;border-radius:0}
.row:focus-visible{outline-offset:-2px;border-radius:var(--radius)}
.row-saat{grid-template-columns:auto minmax(0,1fr) auto}
.times{display:grid;gap:1px;font-family:var(--f-mono);font-size:13px;text-align:right;min-width:46px;font-variant-numeric:tabular-nums}
.times b{font-weight:600;color:var(--ink)}
.times span{color:var(--muted)}
.row-saat .row-main{border-left:2px solid var(--accent-soft);padding-left:12px}
.row-main{display:grid;gap:2px;min-width:0}
.row-t{font-weight:500;overflow-wrap:anywhere}
.row-s{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;font-size:13px;color:var(--muted)}
.rut-s{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:500}
.rut-s svg{width:13px;height:13px}
.tag{display:inline-block;margin-left:6px;padding:0 6px;border-radius:6px;background:var(--sunken);color:var(--muted);font-size:11px;font-weight:500;vertical-align:1px;line-height:1.6}
.tag.rut{background:var(--accent-soft);color:var(--accent)}
.goal .row{padding-bottom:6px}
.steps{list-style:none;margin:0;padding:0 14px 13px;display:grid;gap:7px}
.steps li{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink-2);min-width:0}
.steps li span:last-child{overflow-wrap:anywhere;min-width:0}
.ring{width:22px;height:22px;border-radius:50%;flex:none;display:inline-block;background:conic-gradient(var(--accent) calc(var(--p,0) * 1%),var(--sunken) 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3.5px))}
.ring.sm{width:16px;height:16px;-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2.5px))}
.ring.unset{background:none;border:1.5px dashed var(--axis);-webkit-mask:none;mask:none}
.ring.full{background:var(--accent);-webkit-mask:none;mask:none;display:inline-grid;place-items:center}
.ring.full svg{width:72%;height:72%;fill:none;stroke:var(--accent-ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.lesson{display:grid;gap:8px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.lesson-h{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.lesson-t{margin:0;font-family:var(--f-display);font-size:18px;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere}
.lesson .btn{justify-self:start}
.lesson-act{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px}
.empty{display:grid;justify-items:center;text-align:center;gap:10px;padding:28px 18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.empty>svg{width:60px;height:60px;color:var(--accent)}
.empty h2{font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1.25;text-wrap:balance}
.empty p{margin:0;color:var(--ink-2);max-width:40ch}
.empty-act{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:4px}

/* Teyid */
.sum{display:grid;gap:10px}
.sum-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sum-num{font-size:52px;font-weight:600;line-height:1;letter-spacing:-.02em}
.sum-lbl{font-size:15px;color:var(--ink-2)}
.meter{height:8px;border-radius:4px;background:var(--sunken);overflow:hidden}
.meter span{display:block;height:100%;background:var(--accent);border-radius:4px}
.meter.thin{height:4px}
.sum-dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0}
.sum-dl div{display:grid;gap:2px;min-width:0}
.sum-dl dt{font-size:12px;color:var(--muted)}
.sum-dl dd{margin:0;font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.sum.sm{gap:8px}
.sum-line{font-size:15px;color:var(--ink-2);display:flex;align-items:baseline;gap:8px}
.sum-line b{font-size:24px;color:var(--ink);font-weight:600}
.sum-meta{margin:0;font-size:13px;color:var(--ink-2)}
.warn{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:0;font-size:13px;color:var(--warn)}
.warn svg{width:16px;height:16px;flex:none}
.ctl{padding:14px;display:grid;gap:12px}
.ctl-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.ctl-h h3{font-size:16px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.ctl-p{font:600 16px var(--f-mono);flex:none}
.ctl-plan{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 12px;font-size:13px;color:var(--ink-2)}
.ctl-times{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tf{display:grid;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.ctl-dur{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:13px;color:var(--ink-2)}
.ctl-dur>span:first-child{flex-basis:100%}
.nf{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);font-size:14px}
.nf input{width:64px}
.dev{margin:0;font-size:13px;color:var(--ink-2)}
.dev .w{color:var(--warn);font-weight:600}
.dev .g{color:var(--good);font-weight:600}
.dev .m{color:var(--muted)}
.sl{display:grid;gap:6px}
.sl-l{font-size:13px;color:var(--ink-2)}
.sl-row{display:grid;grid-template-columns:minmax(0,1fr) 52px;align-items:center;gap:10px}
.sl-row output{font:600 14px var(--f-mono);text-align:right}
.chips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.chip{min-height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font:500 13px var(--f-mono);color:var(--ink-2);padding:0}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.ctl-steps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ctl-steps li{display:grid;gap:0}
.st-t{font-size:14px;color:var(--ink-2);overflow-wrap:anywhere}

/* Muhasebe */
.deg{display:grid;gap:12px}
.f-h{font-size:15px;font-weight:600}
.score{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px}
.score button{aspect-ratio:1;max-width:100%;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink-2);font:600 14px var(--f-mono);padding:0}
.score button[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.score button:disabled{cursor:default}
.score button:disabled:not([aria-checked="true"]){opacity:.5}
.score-cap{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.carry{display:grid;gap:8px}
.carry p{margin:0;font-size:14px;color:var(--ink-2)}
.carry .btn{justify-self:start}
.seal-area{display:grid;justify-items:center;gap:12px;padding:24px 16px 20px;text-align:center}
.seal{width:176px;height:176px;color:var(--accent);transform:rotate(-8deg);opacity:.92;overflow:visible}
.seal.fresh{animation:damga .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes damga{0%{transform:scale(1.6) rotate(-18deg);opacity:0}55%{transform:scale(.94) rotate(-7deg);opacity:1}78%{transform:scale(1.03) rotate(-8.5deg)}100%{transform:scale(1) rotate(-8deg);opacity:.92}}
.seal-ph{width:168px;height:168px;border-radius:50%;border:2px dashed var(--axis);display:grid;place-items:center;color:var(--muted);font-size:13px}
.seal-cap{margin:0;font-size:14px;color:var(--ink-2)}

/* Rapor */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:grid;gap:3px;align-content:start;min-width:0}
.tile-l{font-size:12.5px;color:var(--ink-2)}
.tile-v{font-size:25px;font-weight:600;letter-spacing:-.01em;line-height:1.2;overflow-wrap:anywhere}
.tile-v small{font-size:14px;font-weight:500;color:var(--muted);letter-spacing:0}
.tile-s{font-size:12px;color:var(--muted);line-height:1.4}
.delta{font-weight:600}.delta.up{color:var(--good)}.delta.down{color:var(--bad)}
.chart{margin:0}
.chart-cap{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px;margin-bottom:16px}
.chart-title{font-weight:600;font-size:15px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:12px;height:10px;border-radius:2px}
.lg-trk{background:var(--track)}.lg-fil{background:var(--accent)}
.chart-frame{display:grid;grid-template-columns:34px minmax(0,1fr);gap:6px}
.y-axis{position:relative;height:150px}
.y-axis span{position:absolute;right:0;transform:translateY(50%);font:500 11px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1}
.plot{position:relative;height:150px;min-width:0}
.gl{position:absolute;left:0;right:0;height:0;border-top:1px solid var(--line)}
.gl.base{border-top-color:var(--axis)}
.cols{position:absolute;inset:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));grid-template-rows:100%}
.col{position:relative;border:0;background:transparent;padding:0;margin:0;min-width:0;border-radius:6px}
.col:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.bar,.trk,.fil{position:absolute;bottom:0;left:50%;transform:translateX(-50%)}
.bar{width:min(24px,62%);background:var(--accent);border-radius:4px 4px 0 0}
.bar.zero{height:2px;background:var(--axis);border-radius:1px}
.trk{width:min(24px,72%);background:var(--track);border-radius:4px 4px 0 0}
.fil{width:min(10px,34%);background:var(--accent);border-radius:3px 3px 0 0;box-shadow:0 0 0 2px var(--surface)}
.col.on .bar:not(.zero),.col.on .fil{background:var(--accent-hi)}
.ln{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.ln polyline{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.dot{position:absolute;left:50%;width:9px;height:9px;border-radius:50%;background:var(--accent);transform:translate(-50%,50%);box-shadow:0 0 0 2px var(--surface)}

/* ---------- Tarih ---------- */
function today() { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

/* Rapor sekmesi */
function rangeDays(mode, anchor) {
  if (mode === 'h') { const m = monday(anchor); return [0, 1, 2, 3, 4, 5, 6].map(i => addDays(m, i)); }
  const y = anchor.getFullYear(), out = [];
  if (mode === 'a') { const mo = anchor.getMonth(), n = dim(y, mo); for (let i = 1; i <= n; i++) out.push(new Date(y, mo, i)); return out; }
  for (let d = new Date(y, 0, 1); d.getFullYear() === y; d = addDays(d, 1)) out.push(d);
  return out;
}
/* Rapor olanı gösterir: bugünden sonraki günler hesaba katılmaz. */
function dayStat(d, tt) {
  const key = 'g-' + ymd(d), doc = S.docs[key];
  const s = d > tt ? summarize([], null) : summarize(itemsFor(key), doc && doc.deg);
  s.d = d; s.ders = doc && doc.deg && doc.deg.ders ? doc.deg.ders.trim() : '';
  return s;
}
function agg(arr) {
  const pc = arr.filter(s => s.pct != null).map(s => s.pct), pu = arr.filter(s => s.puan != null).map(s => s.puan);
  return { pct: pc.length ? avg(pc) : null, puan: pu.length ? avg(pu) : null, nPct: pc.length, nPuan: pu.length, plan: sum(arr.map(s => s.plan)), act: sum(arr.map(s => s.act)), hasAct: arr.some(s => s.hasAct), hasPlan: arr.some(s => s.n > 0), sealed: arr.filter(s => s.muhur).length, planned: arr.filter(s => s.n > 0).length };
}
function report(mode, anchor) {
  const t = today(), tk = ymd(t);
  const days = rangeDays(mode, anchor).map(d => dayStat(d, t));
  let list;
  if (mode === 'y') {
    const y = anchor.getFullYear();
    list = AY.map((name, m) => Object.assign(agg(days.filter(s => s.d.getMonth() === m)), { xl: AYK[m], full: name + ' ' + y, today: t.getFullYear() === y && t.getMonth() === m }));
  } else {
    list = days.map((s, i) => Object.assign(agg([s]), {
      xl: mode === 'h' ? GUNK[i] : ((s.d.getDate() - 1) % 7 === 0 ? String(s.d.getDate()) : ''),
      full: s.d.getDate() + ' ' + AY[s.d.getMonth()] + ' ' + GUN[wd(s.d)],
      today: ymd(s.d) === tk

  }
  const tot = agg(days), prev = agg(rangeDays(mode, shift(mode, anchor, -1)).map(d => dayStat(d, t)));
  const pk = keyOf(mode, anchor), pItems = itemsFor(pk);
  return { days, list, tot, prev, pk, pItems, any: tot.hasPlan || tot.nPuan > 0 || days.some(s => s.ders) || pItems.length > 0 };
}

    <section class="set"><h3>Örnek veriler</h3><p>Denemek için son üç haftayı örnek planlar, rutinler, teyidler ve muhasebelerle doldurur. Örnekler “örnek” etiketi taşır ve tek dokunuşla silinir.</p><div>${hasSample() ? '<button type="button" class="btn small" data-act="sample-clear">Örnekleri sil</button>' : '<button type="button" class="btn small" data-act="sample">Örnek verilerle dene</button>'}</div></section>
    <section class="set"><h3>Tüm kayıtlar</h3><p>Bütün planlar, rutinler, teyidler ve muhasebeler silinir. Bu işlem geri alınamaz.</p><div><button type="button" class="btn small danger" data-act="wipe">Tüm kayıtları sil</button></div></section>
    <p class="about">Tedbir · taslak 0.3 · SRA Atölye</p>`;
}

/* ---------- İşlemler ---------- */
function arm(el, label, fn) {
  if (el.dataset.armed === '1') { fn(); return; }
  const old = el.textContent;
  el.dataset.armed = '1'; el.textContent = label; el.classList.add('armed');
  setTimeout(() => { if (el.isConnected && el.dataset.armed === '1') { el.dataset.armed = ''; el.textContent = old; el.classList.remove('armed'); } }, 4000);
}
let toastT = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600); }
function takeLesson(from) {
  const src = S.docs[from], txt = src && src.deg && (src.deg.ders || '').trim();
  if (!txt) return;
  const key = curKey(), doc = getDoc(key, true), old = lessonItem(doc, from, txt);
  if (old) old.dersden = from;
  else doc.items.push({ id: uid(), tur: 'yap', ad: lessonTitle(txt), yuzde: null, olus: Date.now(), dersden: from });
  delete doc.dersAlindi;
  commit(key); render(); toast('Ders plana eklendi');
}
function dropLesson(from) {
  const src = S.docs[from], txt = src && src.deg && (src.deg.ders || '').trim();
  const key = curKey(), doc = S.docs[key];
  if (!doc) return;
  const it = lessonItem(doc, from, txt);
  if (it) doc.items = doc.items.filter(i => i !== it);
  delete doc.dersAlindi;
  commit(key); render(); toast('Ders plandan çıkarıldı');
}
/* Aktarılan maddeler "aktarim" işaretiyle bulunur; sonraki planda silinirlerse aktarma düğmesi geri gelir. */
function carried(p, d, key) { const nd = S.docs[keyOf(p, shift(p, d, 1))]; return nd ? nd.items.filter(i => i.aktarim === key) : []; }
function undoCarry() {
  const p = S.period, key = curKey(), nk = keyOf(p, shift(p, S.anchor, 1)), nd = S.docs[nk];
  if (!nd) return;
  nd.items = nd.items.filter(i => i.aktarim !== key);
  commit(nk); render(); toast('Aktarım geri alındı');
}
function carry() {
  const p = S.period, key = curKey(), list = unfinished(itemsFor(key));
  if (!list.length) return;
  const nk = keyOf(p, shift(p, S.anchor, 1)), nd = getDoc(nk, true);
  list.forEach(it => {
    const c = { id: uid(), tur: it.tur, ad: it.ad, yuzde: null, olus: Date.now(), aktarim: key };
    if (it.ornek) c.ornek = true;
    if (it.tur === 'saat') { c.bas = it.bas; c.bit = it.bit; }
    if (it.sure) c.sure = it.sure;
    if (it.tur === 'hedef' && it.adimlar) { const st = it.adimlar.filter(s => (s.yuzde == null ? 0 : s.yuzde) < 100).map(s => ({ id: uid(), ad: s.ad, yuzde: null })); if (st.length) c.adimlar = st; }
    nd.items.push(c);
  });
  if (S.docs[key] && S.docs[key].aktarildi) { delete S.docs[key].aktarildi; commit(key); }
  commit(nk); render(); toast(list.length + ' tedbir ' + DEG.yon[p] + ' aktarıldı');
}
function wipeAll() {
  Object.keys(S.docs).forEach(k => { delete S.docs[k]; Cloud.schedule(k); });
  Object.keys(S.rut).forEach(k => { delete S.rut[k]; Cloud.schedule(k); });
  lsSaveNow(); closeSheet(); render(); toast('Tüm kayıtlar silindi');
}
function clearSample() {
  Object.keys(S.docs).forEach(k => {
    const d = S.docs[k], before = d.items.length, hadDeg = !!(d.deg && d.deg.ornek);
    d.items = d.items.filter(i => !i.ornek);
    if (hadDeg) d.deg = emptyDeg();
    if (d.items.length !== before || hadDeg) commit(k);
  });
  Object.keys(S.rut).forEach(k => { if (S.rut[k].ornek) { delete S.rut[k]; commitR(k); } });
  render(); toast('Örnek veriler silindi');
}
function seeded(s) { return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function makeSample() {
  const rnd = seeded(4517), pick = a => a[Math.floor(rnd() * a.length)], t = today(), start = addDays(t, -20);
  const DERS = ['Sabah telefona bakmadan masaya otur.', 'Kitap okumayı yatmadan bir saat önceye al.', 'Zor işi sabaha, kolay işleri öğleden sonraya koy.', 'Yürüyüşü öğle yemeğinden hemen sonra yap; ertelenince olmuyor.', 'Plana yarım saatlik bir boşluk bırak.', 'Bir işe başlamadan önce ne kadar süreceğini yaz.', 'E-postalara günde iki kez bak, sürekli açık tutma.', 'Saat 22.30’da yatağa geç; geç yatınca sabah çalışması kayıyor.'];
  const st = names => names.map(ad => ({ id: uid(), ad }));
  const firstOn = days => { for (let i = 0; i < 7; i++) { const d = addDays(start, i); if (days.includes(wd(d))) return keyOf('g', d); } return keyOf('g', start); };
  const R = (tpl, tekrar, son) => newRoutine('g', tekrar.tip === 'gunler' ? firstOn(tekrar.gunler) : keyOf('g', start), tpl, tekrar, son || null, true);
  const mk = (tur, ad, extra) => Object.assign({ id: uid(), tur, ad, yuzde: null, olus: Date.now(), ornek: true }, extra || {});
  const put = (key, items, deg) => {
    const doc = getDoc(key, true);
    doc.items.push(...items);
    if (deg && doc.deg.puan == null && !(doc.deg.ders || '').trim() && !doc.deg.muhur) doc.deg = deg;
    commit(key);
  };
  const rs = [
    R({ tur: 'saat', ad: 'Sabah çalışması', bas: '05:30', bit: '07:00' }, { tip: 'her' }),
    R({ tur: 'saat', ad: 'Öğle yürüyüşü', bas: '12:30', bit: '13:00' }, { tip: 'gunler', gunler: [0, 1, 2, 3, 4] }, keyOf('g', addDays(t, 25))),
    R({ tur: 'saat', ad: 'Kitap okuma', bas: '21:00', bit: '21:45' }, { tip: 'her' }),
    R({ tur: 'yap', ad: '20 matematik sorusu çöz', sure: 40 }, { tip: 'gunler', gunler: [0, 2, 4] }),
    R({ tur: 'yap', ad: 'E-postaları yanıtla' }, { tip: 'gunler', gunler: [0, 1, 2, 3, 4] }),
    R({ tur: 'yap', ad: 'Ev temizliği', sure: 60 }, { tip: 'gunler', gunler: [5] }),
    R({ tur: 'hedef', ad: 'Haftayı gözden geçir', adimlar: st(['Notları topla', 'Takvime bak', 'Gelecek haftayı planla']) }, { tip: 'gunler', gunler: [6] })
  ];
  rs.forEach(r => commitR(r.k));
  for (let i = 20; i >= 1; i--) {
    const d = addDays(t, -i), key = keyOf('g', d);
    const items = rs.filter(r => occurs(r, key)).map(materialize);
    items.forEach(it => {
      if (it.adimlar) { it.adimlar.forEach(s => { s.yuzde = pick([100, 100, 100, 60, 0]); }); return; }
      const pc = pick([100, 100, 100, 100, 80, 60, 50, 0]);
      it.yuzde = pc;
      if (it.tur === 'saat' && pc > 0) {
        const s0 = toMin(it.bas) + pick([0, 0, 5, 10, 15, 25, -5]);
        let e0 = toMin(it.bit) + pick([-15, -10, 0, 0, 0, 5, 10]) - Math.round(span(it.bas, it.bit) * (100 - pc) / 100);
        if (e0 <= s0) e0 = s0 + 10;
        it.gBas = hm(s0); it.gBit = hm(e0);
      }
      if (it.sure && pc > 0) it.gSure = Math.max(5, Math.round(it.sure * pc / 100) + pick([-5, 0, 0, 5]));
    });
    const s = summarize(items, null);
    put(key, items, { puan: Math.max(2, Math.min(10, Math.round((s.pct || 0) / 11 + (rnd() - 0.5) * 2))), ders: i % 2 === 1 ? (i === 1 ? DERS[0] : pick(DERS)) : '', muhur: i % 6 === 4 ? null : new Date(d.getFullYear(), d.getMonth(), d.getDate(), 22, 10).getTime(), ornek: true });
  }
  const lastSun = addDays(monday(t), -1), lastW = keyOf('h', lastSun), thisW = keyOf('h', t);
  const spor = newRoutine('h', lastW, { tur: 'yap', ad: 'Üç kez spor yap' }, { tip: 'her' }, null, true);
  const ing = newRoutine('h', lastW, { tur: 'yap', ad: 'İngilizce çalış', sure: 3 * BIRIM.gun }, { tip: 'her' }, null, true);
  commitR(spor.k); commitR(ing.k);
  const occ = (r, extra) => Object.assign(materialize(r), extra);
  put(lastW, [occ(spor, { yuzde: 100 }), occ(ing, { yuzde: 100, gSure: 3 * BIRIM.gun })], { puan: 7, ders: 'Sporu sabaha almak işe yaradı; akşama kalınca hep erteleniyordu.', muhur: new Date(lastSun.getFullYear(), lastSun.getMonth(), lastSun.getDate(), 22, 0).getTime(), ornek: true });
  put(thisW, [occ(spor, { yuzde: 60 }), occ(ing, { yuzde: 45, gSure: BIRIM.gun + 4 * BIRIM.saat }), mk('hedef', 'Bir kitap bitir', { adimlar: [{ id: uid(), ad: '1–100. sayfa', yuzde: 100 }, { id: uid(), ad: '101–200. sayfa', yuzde: 40 }, { id: uid(), ad: '201–280. sayfa', yuzde: null }] })], null);
  put(keyOf('a', t), [mk('hedef', 'Çevrim içi kursu bitir', { sure: 3 * BIRIM.hafta + 2 * BIRIM.gun, adimlar: ['1. modül', '2. modül', '3. modül', '4. modül'].map((ad, j) => ({ id: uid(), ad, yuzde: [100, 100, 30, null][j] })) })], null);
  put(keyOf('y', t), [mk('yap', 'Yüzmeyi öğren', { sure: 2 * BIRIM.ay + 2 * BIRIM.hafta + 3 * BIRIM.gun })], null);
  render(); toast('Örnek veriler eklendi');
}

/* ---------- Grafik ipuçları ---------- */
function showTip(col) {
  const plot = col.closest('.plot'); if (!plot) return;
  const tip = plot.querySelector('.tip');
  plot.querySelectorAll('.col.on').forEach(c => c.classList.remove('on'));
  col.classList.add('on');
  tip.replaceChildren();
  const a = document.createElement('strong'); a.textContent = col.dataset.t1 || ''; tip.appendChild(a);
  ['t2', 't3'].forEach(k => { if (col.dataset[k]) { const s = document.createElement('span'); s.textContent = col.dataset[k]; tip.appendChild(s); } });
  tip.hidden = false;
  const pw = plot.clientWidth, tw = tip.offsetWidth, cx = col.offsetLeft + col.offsetWidth / 2;
  tip.style.left = Math.max(0, Math.min(pw - tw, cx - tw / 2)) + 'px';
}
function hideTipIn(plot) { const t = plot.querySelector('.tip'); if (t) t.hidden = true; plot.querySelectorAll('.col.on').forEach(c => c.classList.remove('on')); }
function hideTips() { document.querySelectorAll('.plot').forEach(hideTipIn); }

/* ---------- Olaylar ---------- */
function act(a, el) {
  const ds = el.dataset, key = curKey(), e = S.ed, p = S.period;
  switch (a) {
    case 'tab':
      if (ds.tab === 'rapor' && !S.rpTouched) S.rp.anchor = new Date(S.anchor);
      S.tab = ds.tab; window.scrollTo(0, 0); render(); break;
    case 'goto': S.tab = ds.tab; window.scrollTo(0, 0); render(); break;
    case 'period': if (S.tab === 'rapor') S.rp.mode = ds.p; else S.period = ds.p; render(); break;
    case 'prev': case 'next': {
      const n = a === 'next' ? 1 : -1;
      if (S.tab === 'rapor') { S.rp.anchor = shift(S.rp.mode, S.rp.anchor, n); S.rpTouched = true; } else S.anchor = shift(S.period, S.anchor, n);
      render(); break;
    }
    case 'today': if (S.tab === 'rapor') S.rp.anchor = today(); else S.anchor = today(); render(); break;
    case 'add': openEditor(null, el); break;
    case 'edit': openEditor(ds.id, el); break;
    case 'settings': S.sheet = 'ayar'; openSheet(el); break;
    case 'sheet-close': closeSheet(); break;
    case 'ed-type':
      readEditor(); e.tur = ds.t; e.err = '';
      if (ds.t === 'saat' && !e.bas) { e.bas = defaultStart(e.key); e.bit = hm(toMin(e.bas) + 60); }
      if (ds.t === 'hedef' && !e.adimlar.length) e.adimlar.push({ id: uid(), ad: '' });
      renderSheet(); break;
    case 'ed-step-add': { readEditor(); const s = { id: uid(), ad: '' }; e.adimlar.push(s); renderSheet(); focusEl('#ed-st-' + s.id); break; }
    case 'ed-step-del': readEditor(); e.adimlar = e.adimlar.filter(s => s.id !== ds.sid); renderSheet(); break;
    case 'ed-rut': readEditor(); e.rut = !e.rut; e.err = ''; renderSheet(); break;
    case 'ed-rtip': readEditor(); e.rTip = ds.v; e.err = ''; renderSheet(); break;
    case 'ed-rson': readEditor(); e.rSon = ds.v; e.err = ''; renderSheet(); break;
    case 'ed-wd': { const w = Number(ds.w); e.rGun = e.rGun.includes(w) ? e.rGun.filter(x => x !== w) : e.rGun.concat([w]); el.setAttribute('aria-pressed', String(e.rGun.includes(w))); break; }
    case 'ed-save': saveEditor(); break;
    case 'ed-del': arm(el, 'Silmek için tekrar dokun', deleteItem); break;
    case 'ed-rut-stop': arm(el, 'Kaldırmak için tekrar dokun', () => {
      const r = S.rut[e.rKey]; if (!r) return;
      const full = stopRoutine(r, e.key);
      closeSheet(); render(); toast(full ? 'Rutin tamamen kaldırıldı' : 'Sonraki tekrarlar silindi');
    }); break;
    case 'ed-occ-del': arm(el, 'Silmek için tekrar dokun', () => {
      const r = S.rut[e.rKey]; if (!r) return;
      skipOcc(r, e.key); closeSheet(); render(); toast({ g: 'Bu günkü tekrar silindi', h: 'Bu haftaki tekrar silindi', a: 'Bu ayki tekrar silindi', y: 'Bu yılki tekrar silindi' }[p]);
    }); break;
    case 'aynen': { const it = ensureItem(key, ds.id); if (!it) break; it.gBas = it.bas; it.gBit = it.bit; it.yuzde = 100; commit(key); replaceCtl(it); break; }
    case 'set-pct': { const it = ensureItem(key, ds.id); if (!it) break; it.yuzde = Number(ds.v); commit(key); replaceCtl(it); break; }
    case 'score': { const doc = getDoc(key, true); doc.deg.puan = Number(ds.v); commit(key); render(); break; }
    case 'seal': { const doc = getDoc(key, true); if (doc.deg.puan == null) { toast('Önce puan ver.'); break; } doc.deg.muhur = Date.now(); commit(key); justSealed = key; render(); break; }
    case 'unseal': { const doc = getDoc(key, true); doc.deg.muhur = null; commit(key); render(); break; }
    case 'carry': carry(); break;
    case 'take-lesson': takeLesson(ds.from); break;
    case 'drop-lesson': dropLesson(ds.from); break;
    case 'undo-carry': undoCarry(); break;
    case 'sample': closeSheet(); makeSample(); break;
    case 'sample-clear': clearSample(); if (S.sheet) renderSheet(); break;
    case 'wipe': arm(el, 'Emin misin? Tekrar dokun', wipeAll); break;
    case 'open-period': S.tab = 'tedbir'; S.period = S.rp.mode; S.anchor = new Date(S.rp.anchor); window.scrollTo(0, 0); render(); break;
  }
}
document.addEventListener('click', ev => {
  const col = ev.target.closest('.col');
  if (col) { showTip(col); return; }
  hideTips();
  const el = ev.target.closest('[data-act]');
  if (!el || el.disabled) return;
  act(el.dataset.act, el);
});
function onInput(ev) {
  const el = ev.target;
  if (el.id === 'ed-bas' || el.id === 'ed-bit') { const c = $('#ed-calc'), b = $('#ed-bas'), t = $('#ed-bit'); if (c && b && t) c.textContent = calcText(b.value, t.value); return; }
  const f = el.dataset && el.dataset.in;
  if (!f) return;
  const key = curKey();
  if (f === 'ders') { const doc = getDoc(key, true); doc.deg.ders = el.value; commit(key); return; }
  const it = ensureItem(key, el.dataset.id);
  if (!it) return;
  if (f === 'yuzde') {
    const v = Number(el.value);
    if (el.dataset.sid) { const s = (it.adimlar || []).find(x => x.id === el.dataset.sid); if (s) s.yuzde = v; } else it.yuzde = v;
    el.classList.remove('unset'); el.style.setProperty('--v', v + '%');
    const o = document.getElementById('o-' + el.id); if (o) o.textContent = fmtPct(v);
    if (!el.dataset.sid) { const box = document.getElementById('ctl-' + it.id); if (box) box.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(Number(c.dataset.v) === v))); }
  } else if (f === 'gBas' || f === 'gBit') it[f] = el.value || null;
  else if (f === 'gSure') it.gSure = readDur('gs-' + it.id, S.period);
  refreshCtl(it); commit(key);
}
document.addEventListener('input', onInput);
document.addEventListener('change', onInput);
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') { if (S.sheet) closeSheet(); hideTips(); return; }
  if (ev.key === 'Enter' && S.sheet === 'item' && ev.target.tagName === 'INPUT') {
    if (ev.target.id === 'ed-ad') { ev.preventDefault(); saveEditor(); }
    else if (ev.target.dataset.sid) { ev.preventDefault(); act('ed-step-add', ev.target); }
  }
});
document.addEventListener('pointerover', ev => { if (ev.pointerType !== 'mouse') return; const col = ev.target.closest && ev.target.closest('.col'); if (col) showTip(col); });
document.addEventListener('pointerout', ev => { if (ev.pointerType !== 'mouse') return; const plot = ev.target.closest && ev.target.closest('.plot'); if (plot && !(ev.relatedTarget && plot.contains(ev.relatedTarget))) hideTipIn(plot); });
document.addEventListener('focusin', ev => { const col = ev.target.closest && ev.target.closest('.col'); if (col) showTip(col); });
document.addEventListener('focusout', ev => {
  const col = ev.target.closest && ev.target.closest('.col');
  if (col) { const plot = col.closest('.plot'); if (plot && !(ev.relatedTarget && plot.contains(ev.relatedTarget))) hideTipIn(plot); }
  setTimeout(() => { if (pendingRender) renderSafe(); }, 60);
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { lsSaveNow(); Cloud.flushAll(); } });
window.addEventListener('pagehide', () => { lsSaveNow(); Cloud.flushAll(); });

/* ---------- Telefon uygulaması bağlantıları (Android geri tuşu ve arka plana geçerken kaydetme) ---------- */
window.tedbirBack = () => { if (S.sheet) { closeSheet(); return true; } return false; };
window.tedbirSave = () => { lsSaveNow(); };

/* ---------- Başlat ---------- */
S.docs = sane(lsGet(LS.docs));
S.rut = saneR(lsGet(LS.rut));
const ui = lsGet(LS.ui) || {};
if (['tedbir', 'kontrol', 'deger', 'rapor'].includes(ui.tab)) S.tab = ui.tab;
if (['g', 'h', 'a', 'y'].includes(ui.period)) S.period = ui.period;
if (['h', 'a', 'y'].includes(ui.rp)) S.rp.mode = ui.rp;
render();
connectCloud();
})();
</script>
